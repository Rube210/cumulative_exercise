name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project packages
        run: python -m pip install --upgrade pip && python -m pip install -r web_app/requirement.txt

      - name: Check code style formatting
        run: python -m black --check .

      - name: Run code linter
        run: python -m pylint web_app

      - name: Run type checks
        run: python -m mypy web_app

      - name: Run unit tests
        run: python -m pytest

  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t custom-web-app:ci -f Dockerfile web_app/

      - name: Start container
        run: docker run -d --rm --name custom-web-app-ci -p 8000:8000 custom-web-app:ci

      - name: Smoke test application
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:8000/

      - name: Stop container
        if: always()
        run: docker stop custom-web-app-ci || true
