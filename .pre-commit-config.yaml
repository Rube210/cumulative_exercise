repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: python -m pylint
        language: system
        types: [python]
        args: ["web_app"]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        args: ["--no-incremental", "web_app"]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true